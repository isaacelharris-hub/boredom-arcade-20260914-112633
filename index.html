<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>World Atlas — Boredom Arcade</title>
<meta name="description" content="A premium, fast country browser with everything about every country.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --bg-2:#efeee9;
    --ink:#1c1c1a;
    --ink-soft:#5c5b57;
    --line:#e2e0da;
    --glass:rgba(255,255,255,0.72);
    --glass-strong:rgba(255,255,255,0.92);
    --shadow:0 8px 30px rgba(20,20,18,0.10);
    --shadow-soft:0 2px 10px rgba(20,20,18,0.06);
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}

  /* ---------- Loading ---------- */
  #loading{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;transition:opacity .5s ease, visibility .5s ease;}
  #loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .loading-title{font-size:13px;letter-spacing:.24em;font-weight:700;color:var(--ink-soft);margin-bottom:14px;}
  .loading-sub{font-size:15px;color:var(--ink);margin-bottom:26px;}
  .loading-bar{width:180px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .loading-bar span{display:block;width:40%;height:100%;background:var(--ink);border-radius:2px;animation:loadmove 1.1s ease-in-out infinite;}
  @keyframes loadmove{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
  .loading-error{max-width:360px;text-align:center;display:none;}
  .loading-error.show{display:block;}
  .loading-error h3{margin:0 0 8px;font-size:17px;}
  .loading-error p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
  .loading-error button{padding:10px 20px;border-radius:999px;border:1px solid var(--line);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}

  /* ---------- Layout ---------- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header{position:sticky;top:0;z-index:40;background:rgba(247,246,243,0.85);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:18px 26px 16px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{user-select:none;}
  .brand .b1{font-size:10.5px;letter-spacing:.22em;font-weight:700;color:var(--ink-soft);}
  .brand .b2{font-size:19px;font-weight:800;letter-spacing:.01em;color:var(--ink);margin-top:2px;}
  .status-pill{align-self:flex-start;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--ink-soft);
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px;
    display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .status-dot{width:6px;height:6px;border-radius:50%;background:#3fb95f;flex:none;}
  .status-pill.loading .status-dot{background:#c9a227;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap;}
  .search-shell{position:relative;flex:1;min-width:220px;max-width:480px;
    background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;
    display:flex;align-items:center;gap:10px;padding:11px 16px;
    transition:box-shadow .25s ease, border-color .25s ease, background .25s ease;}
  .search-shell:focus-within{box-shadow:var(--shadow-soft);border-color:#cfcdc6;background:var(--glass-strong);}
  .search-icon{font-size:15px;color:var(--ink-soft);flex:none;}
  #search{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink);}
  #search::placeholder{color:#98968f;}
  .kbd{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none;background:rgba(255,255,255,.5);}

  select#sort-select{
    background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 14px;
    font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;outline:none;
  }
  .ctrl-btn{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:10px 14px;
    font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .2s ease, transform .15s ease;}
  .ctrl-btn:hover{background:var(--glass-strong);}
  .ctrl-btn:active{transform:scale(.97);}
  .ctrl-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip-btn{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.04);border:1px solid var(--line);
    border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-soft);transition:background .15s ease,color .15s ease;}
  .chip-btn:hover{background:rgba(0,0,0,.07);}
  .chip-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .result-count{font-size:12px;color:var(--ink-soft);margin-top:10px;}

  /* ---------- Grid ---------- */
  main{flex:1;padding:22px 26px 90px;}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
    cursor:pointer;transition:box-shadow .18s ease, transform .12s ease, background .18s ease;position:relative;}
  .card:hover{box-shadow:var(--shadow-soft);background:var(--glass-strong);transform:translateY(-1px);}
  .card.selected{outline:2px solid var(--ink);background:var(--glass-strong);}
  .card-check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
    border:1.5px solid var(--line);background:#fff;display:none;align-items:center;justify-content:center;font-size:12px;}
  .compare-on .card-check{display:flex;}
  .card.selected .card-check{background:var(--ink);color:#fff;border-color:var(--ink);}
  .card-flag{width:100%;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#eee;}
  .card-name{font-size:14.5px;font-weight:700;margin-top:10px;}
  .card-capital{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .card-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-soft);}
  .no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-soft);}

  /* ---------- Floating compare bar ---------- */
  #compare-bar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:70;
    background:var(--ink);color:#fff;border-radius:999px;padding:12px 10px 12px 20px;
    display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  #compare-bar.show{transform:translate(-50%,0);}
  #compare-bar span{font-size:13px;font-weight:600;}
  #compare-bar button{border:none;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
  #compare-bar .go-btn{background:#fff;color:var(--ink);}
  #compare-bar .clear-btn{background:rgba(255,255,255,.15);color:#fff;}

  /* ---------- Country panel ---------- */
  #country-panel{position:fixed;top:0;right:0;height:100%;width:min(460px,100vw);
    background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.08);
    z-index:60;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;padding:26px 24px 60px;}
  #country-panel.open{transform:translateX(0);}
  .panel-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;font-size:15px;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .panel-flag{width:100%;height:130px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);background:#eee;}
  .panel-name{font-size:24px;font-weight:800;margin-top:16px;}
  .panel-official{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .panel-quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.045);border:1px solid var(--line);border-radius:999px;padding:5px 10px;}
  .chip.link{cursor:pointer;}
  .chip.link:hover{background:rgba(0,0,0,.09);}
  .panel-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .stat-card{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;}
  .stat-label{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;}
  .stat-value{font-size:17px;font-weight:700;margin-top:4px;}
  .panel-section{margin-top:26px;}
  .section-title{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
  .kv-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{color:var(--ink-soft);flex:none;}
  .kv-value{font-weight:600;text-align:right;}
  .border-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .compare-btn{margin-top:26px;width:100%;padding:12px;border-radius:999px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}
  .compare-btn:hover{opacity:.92;}

  /* ---------- Compare modal ---------- */
  #compare-modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,18,.32);backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s ease;padding:20px;}
  #compare-modal.open{opacity:1;visibility:visible;}
  .compare-box{width:min(900px,96vw);max-height:88vh;overflow-y:auto;background:var(--glass-strong);
    border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px;position:relative;
    transform:translateY(14px);transition:transform .3s ease;}
  #compare-modal.open .compare-box{transform:translateY(0);}
  .compare-search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.7);font-size:14px;margin-bottom:12px;outline:none;}
  #compare-search-results .result-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-radius:10px;}
  #compare-search-results .result-row:hover{background:rgba(0,0,0,.045);}
  .result-flag{width:22px;height:16px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex:none;background:#eee;}
  .result-name{font-size:13.5px;font-weight:600;}
  .result-region{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px;}
  .compare-col{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:120px;}
  .compare-col h3{margin:0 0 4px;font-size:17px;}
  .compare-empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px;}
  .compare-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);gap:10px;}
  .compare-row:last-child{border-bottom:none;}
  .compare-row strong{text-align:right;}

  @media (max-width:720px){
    #country-panel{width:100%;top:auto;bottom:0;height:86vh;border-left:none;border-top:1px solid var(--line);
      border-radius:22px 22px 0 0;transform:translateY(100%);}
    #country-panel.open{transform:translateY(0);}
    .compare-grid{grid-template-columns:1fr;}
    header{padding:14px 16px;}
    main{padding:16px 16px 90px;}
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-title">WORLD ATLAS</div>
  <div class="loading-sub" id="loading-text">Loading country data…</div>
  <div class="loading-bar"><span></span></div>
  <div class="loading-error" id="loading-error">
    <h3>Atlas couldn't finish loading</h3>
    <p>The core atlas data could not be initialized.</p>
    <button id="retry-btn">Retry</button>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="b1">BOREDOM ARCADE</div>
        <div class="b2">World Atlas</div>
      </div>
      <div class="status-pill loading" id="status-pill">
        <span class="status-dot"></span><span id="status-text">LOADING</span>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-shell">
        <span class="search-icon">⌕</span>
        <input id="search" type="text" placeholder="Search countries..." autocomplete="off" aria-label="Search countries">
        <span class="kbd">⌘K</span>
      </div>
      <select id="sort-select" aria-label="Sort countries">
        <option value="name">Name (A–Z)</option>
        <option value="population">Population (high–low)</option>
        <option value="area">Area (high–low)</option>
      </select>
      <button class="ctrl-btn" id="btn-compare-mode">Compare</button>
      <button class="ctrl-btn" id="btn-random">Random country</button>
      <button class="ctrl-btn" id="btn-reset">Reset</button>
    </div>

    <div class="chips" id="region-chips"></div>
    <div class="result-count" id="result-count"></div>
  </header>

  <main>
    <div id="grid"></div>
  </main>
</div>

<div id="compare-bar">
  <span id="compare-bar-text">Select 2 countries to compare</span>
  <button class="clear-btn" id="compare-clear">Clear</button>
  <button class="go-btn" id="compare-go">Compare →</button>
</div>

<div id="country-panel"></div>

<div id="compare-modal">
  <div class="compare-box">
    <button class="panel-close" id="compare-close" style="position:absolute;top:16px;right:16px;">✕</button>
    <h2 style="margin:0 0 14px;font-size:18px;">Compare countries</h2>
    <input class="compare-search" id="compare-search" placeholder="Search a country to compare..." autocomplete="off">
    <div id="compare-search-results"></div>
    <div class="compare-grid" id="compare-grid"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var state = {
    atlas:null,
    countryByISO:new Map(),
    filtered:[],
    activeRegion:"All",
    sortBy:"name",
    searchTerm:"",
    compareMode:false,
    compareSelection:[],
    compareA:null,
    compareB:null
  };

  var WB_INDICATORS = {
    gdp:'NY.GDP.MKTP.CD',
    gdpPerCapita:'NY.GDP.PCAP.CD',
    gdpGrowth:'NY.GDP.MKTP.KD.ZG',
    inflation:'FP.CPI.TOTL.ZG',
    unemployment:'SL.UEM.TOTL.ZS',
    internetUsage:'IT.NET.USER.ZS',
    lifeExpectancy:'SP.DYN.LE00.IN'
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function dash(v){ return (v===null||v===undefined||v==='') ? '—' : v; }

  function formatPopulation(n){
    if(n===null||n===undefined) return '—';
    if(n>=1e9) return (n/1e9).toFixed(1)+'B';
    if(n>=1e6) return (n/1e6).toFixed(1)+'M';
    if(n>=1e3) return (n/1e3).toFixed(1)+'K';
    return String(n);
  }
  function formatNumber(n){
    if(n===null||n===undefined) return '—';
    return Number(n).toLocaleString('en-US');
  }
  function formatArea(n){
    if(n===null||n===undefined) return '—';
    return Number(n).toLocaleString('en-US')+' km²';
  }
  function formatDensity(pop, area){
    if(!pop || !area) return '—';
    return (pop/area).toFixed(1)+' /km²';
  }
  function formatCurrencies(list){
    if(!list||!list.length) return '—';
    return list.map(function(c){ return c.name ? (c.name+' ('+c.code+')') : c.code; }).join(', ');
  }
  function formatList(list){
    if(!list||!list.length) return '—';
    return list.join(', ');
  }
  function formatCoords(latlng){
    if(!latlng||latlng.length<2) return '—';
    return latlng[0].toFixed(2)+'°, '+latlng[1].toFixed(2)+'°';
  }
  function formatWB(entry, opts){
    opts = opts || {};
    if(!entry || entry.value===null || entry.value===undefined) return 'Data unavailable';
    var v = entry.value, str;
    if(opts.money){
      if(Math.abs(v)>=1e12) str = '$'+(v/1e12).toFixed(2)+'T';
      else if(Math.abs(v)>=1e9) str = '$'+(v/1e9).toFixed(2)+'B';
      else if(Math.abs(v)>=1e6) str = '$'+(v/1e6).toFixed(2)+'M';
      else str = '$'+formatNumber(Math.round(v));
    } else if(opts.percent){
      str = v.toFixed(1)+'%';
    } else {
      str = formatNumber(Math.round(v*10)/10);
    }
    return str + (entry.year ? ' · '+entry.year : '');
  }

  function setStatus(text, mode){
    var pill = $('status-pill');
    $('status-text').textContent = text;
    pill.classList.remove('loading');
    if(mode) pill.classList.add(mode);
  }
  function hideLoading(){
    $('loading').classList.add('hidden');
    $('app').style.display = '';
  }
  function showLoadingError(){
    $('loading-error').classList.add('show');
    $('loading-text').style.display = 'none';
    document.querySelector('.loading-bar').style.display = 'none';
  }

  // ---------------- BOOT ----------------
  async function boot(){
    try{
      setStatus('LOADING','loading');
      var res = await fetch('./atlas-data.json');
      if(!res.ok) throw new Error('atlas-data.json fetch failed: '+res.status);
      var atlas = await res.json();
      state.atlas = atlas;
      atlas.countries.forEach(function(c){ state.countryByISO.set(c.cca3, c); });

      buildRegionChips();
      applyFilters();
      setStatus('ATLAS READY');
      hideLoading();
    }catch(err){
      console.error(err);
      showLoadingError();
    }
  }
  boot();
  $('retry-btn').addEventListener('click', function(){
    $('loading-error').classList.remove('show');
    $('loading-text').style.display='';
    document.querySelector('.loading-bar').style.display='';
    boot();
  });

  // ---------------- REGION CHIPS ----------------
  function buildRegionChips(){
    var regions = Array.from(new Set(state.atlas.countries.map(function(c){ return c.region; }).filter(Boolean))).sort();
    var container = $('region-chips');
    var chips = ['All'].concat(regions);
    container.innerHTML = chips.map(function(r){
      return '<button class="chip-btn'+(r==='All'?' active':'')+'" data-region="'+esc(r)+'">'+esc(r)+'</button>';
    }).join('');
    Array.prototype.forEach.call(container.querySelectorAll('.chip-btn'), function(btn){
      btn.addEventListener('click', function(){
        state.activeRegion = btn.getAttribute('data-region');
        Array.prototype.forEach.call(container.querySelectorAll('.chip-btn'), function(b){
          b.classList.toggle('active', b===btn);
        });
        applyFilters();
      });
    });
  }

  // ---------------- FILTER / SORT / RENDER ----------------
  var searchInput = $('search');
  var searchDebounce = null;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function(){
      state.searchTerm = searchInput.value.trim().toLowerCase();
      applyFilters();
    }, 90);
  });
  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && state.filtered.length){
      openCountryPanel(state.filtered[0]);
    } else if(e.key === 'Escape'){
      searchInput.value='';
      state.searchTerm='';
      applyFilters();
      searchInput.blur();
    }
  });

  $('sort-select').addEventListener('change', function(e){
    state.sortBy = e.target.value;
    applyFilters();
  });

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if((e.key === '/' && tag !== 'INPUT') || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
      e.preventDefault();
      searchInput.focus();
    } else if(e.key === 'Escape'){
      closeCompareModal();
      closeCountryPanel();
    }
  });

  function applyFilters(){
    var list = state.atlas.countries.slice();
    if(state.activeRegion !== 'All'){
      list = list.filter(function(c){ return c.region === state.activeRegion; });
    }
    if(state.searchTerm){
      var q = state.searchTerm;
      list = list.filter(function(c){
        return (c.name||'').toLowerCase().indexOf(q)!==-1 ||
               (c.officialName||'').toLowerCase().indexOf(q)!==-1 ||
               (c.cca2||'').toLowerCase()===q ||
               (c.cca3||'').toLowerCase()===q;
      });
    }
    if(state.sortBy === 'population'){
      list.sort(function(a,b){ return (b.population||0)-(a.population||0); });
    } else if(state.sortBy === 'area'){
      list.sort(function(a,b){ return (b.area||0)-(a.area||0); });
    } else {
      list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    }
    state.filtered = list;
    renderGrid();
  }

  function renderGrid(){
    var grid = $('grid');
    var list = state.filtered;
    $('result-count').textContent = list.length + (list.length===1 ? ' country' : ' countries');
    grid.classList.toggle('compare-on', state.compareMode);
    if(!list.length){
      grid.innerHTML = '<div class="no-results">No countries match your search.</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    var html = list.map(function(c){
      var flag = c.flagPng || c.flagSvg || '';
      var selected = state.compareSelection.indexOf(c.cca3) !== -1;
      return '<div class="card'+(selected?' selected':'')+'" data-cca3="'+esc(c.cca3)+'">'+
        '<div class="card-check">'+(selected?'✓':'')+'</div>'+
        (flag ? '<img class="card-flag" loading="lazy" src="'+esc(flag)+'" alt="Flag of '+esc(c.name)+'">' : '<div class="card-flag"></div>')+
        '<div class="card-name">'+esc(c.name)+'</div>'+
        '<div class="card-capital">'+esc(dash(c.capital))+'</div>'+
        '<div class="card-meta"><span>'+esc(c.region||'—')+'</span><span>'+esc(formatPopulation(c.population))+'</span></div>'+
      '</div>';
    }).join('');
    grid.innerHTML = html;
    Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(card){
      card.addEventListener('click', function(){
        var c = state.countryByISO.get(card.getAttribute('data-cca3'));
        if(!c) return;
        if(state.compareMode){
          toggleCompareSelection(c);
        } else {
          openCountryPanel(c);
        }
      });
    });
  }

  // ---------------- COMPARE MODE (grid selection) ----------------
  var compareBar = $('compare-bar');
  $('btn-compare-mode').addEventListener('click', function(){
    state.compareMode = !state.compareMode;
    $('btn-compare-mode').classList.toggle('active', state.compareMode);
    if(!state.compareMode){
      state.compareSelection = [];
      updateCompareBar();
    }
    renderGrid();
  });

  function toggleCompareSelection(c){
    var idx = state.compareSelection.indexOf(c.cca3);
    if(idx !== -1){
      state.compareSelection.splice(idx,1);
    } else {
      if(state.compareSelection.length >= 2) state.compareSelection.shift();
      state.compareSelection.push(c.cca3);
    }
    updateCompareBar();
    renderGrid();
  }

  function updateCompareBar(){
    var n = state.compareSelection.length;
    if(state.compareMode && n>0){
      compareBar.classList.add('show');
      $('compare-bar-text').textContent = n===2 ? 'Ready to compare' : ('Select '+(2-n)+' more countr'+(2-n===1?'y':'ies'));
      $('compare-go').style.opacity = n===2 ? '1' : '.4';
      $('compare-go').style.pointerEvents = n===2 ? 'auto' : 'none';
    } else {
      compareBar.classList.remove('show');
    }
  }
  $('compare-clear').addEventListener('click', function(){
    state.compareSelection = [];
    updateCompareBar();
    renderGrid();
  });
  $('compare-go').addEventListener('click', function(){
    if(state.compareSelection.length !== 2) return;
    var a = state.countryByISO.get(state.compareSelection[0]);
    var b = state.countryByISO.get(state.compareSelection[1]);
    openCompareModal(a, b);
  });

  // ---------------- OTHER CONTROLS ----------------
  $('btn-random').addEventListener('click', function(){
    if(!state.atlas) return;
    var list = state.atlas.countries;
    var pick = list[Math.floor(Math.random()*list.length)];
    if(pick) openCountryPanel(pick);
  });
  $('btn-reset').addEventListener('click', function(){
    searchInput.value = '';
    state.searchTerm = '';
    state.activeRegion = 'All';
    state.sortBy = 'name';
    $('sort-select').value = 'name';
    state.compareMode = false;
    state.compareSelection = [];
    $('btn-compare-mode').classList.remove('active');
    buildRegionChips();
    closeCountryPanel();
    closeCompareModal();
    updateCompareBar();
    applyFilters();
  });

  // ---------------- COUNTRY PANEL ----------------
  var panel = $('country-panel');

  function openCountryPanel(country){
    panel.innerHTML = renderPanelHTML(country);
    panel.classList.add('open');
    $('panel-close-btn').addEventListener('click', closeCountryPanel);
    $('open-compare-btn').addEventListener('click', function(){ openCompareModal(country, null); });
    Array.prototype.forEach.call(panel.querySelectorAll('.chip.link'), function(chip){
      chip.addEventListener('click', function(){
        var target = state.countryByISO.get(chip.getAttribute('data-cca3'));
        if(target) openCountryPanel(target);
      });
    });
    panel.scrollTop = 0;
    loadEconomyData(country);
  }
  function closeCountryPanel(){
    panel.classList.remove('open');
  }

  function renderPanelHTML(c){
    var flag = c.flagPng || c.flagSvg || '';
    var borderChips = (c.borders||[]).map(function(code){
      var b = state.countryByISO.get(code);
      var label = b ? b.name : code;
      return '<span class="chip link" data-cca3="'+esc(code)+'">'+esc(label)+'</span>';
    }).join('');

    return ''+
    '<button class="panel-close" id="panel-close-btn" aria-label="Close panel">✕</button>'+
    (flag ? '<img class="panel-flag" src="'+esc(flag)+'" alt="Flag of '+esc(c.name)+'">' : '')+
    '<div class="panel-name">'+esc(c.name)+' '+esc(c.flagEmoji||'')+'</div>'+
    '<div class="panel-official">'+esc(c.officialName||'')+'</div>'+
    '<div class="panel-quick">'+
      '<span class="chip">'+esc(c.cca2||'—')+' / '+esc(c.cca3||'—')+'</span>'+
      (c.unMember ? '<span class="chip">UN member</span>' : '')+
      (c.independent ? '<span class="chip">Independent</span>' : '')+
      (c.landlocked ? '<span class="chip">Landlocked</span>' : '')+
    '</div>'+
    '<div class="panel-stats">'+
      statCard('Population', formatPopulation(c.population))+
      statCard('Area', formatArea(c.area))+
      statCard('Capital', dash(c.capital))+
      statCard('Region', dash(c.region))+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Identity</div>'+
      kv('Official name', dash(c.officialName))+
      kv('ISO alpha-2 / alpha-3', esc(c.cca2||'—')+' / '+esc(c.cca3||'—'))+
      kv('IOC code', dash(c.cioc))+
      kv('FIFA code', dash(c.fifa))+
      kv('Internet domain(s)', formatList(c.tld))+
      kv('Continent(s)', formatList(c.continents))+
      kv('Status', dash(c.status))+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Geography</div>'+
      kv('Capital', dash(c.capital))+
      kv('Capital coordinates', formatCoords(c.capitalLatLng))+
      kv('Country coordinates', formatCoords(c.latlng))+
      kv('Subregion', dash(c.subregion))+
      kv('Landlocked', c.landlocked ? 'Yes' : 'No')+
      kv('Driving side', dash(c.drivingSide))+
      kv('Time zones', formatList(c.timezones))+
      (borderChips ? '<div class="kv-row" style="display:block;"><div class="kv-label" style="margin-bottom:6px;">Bordering countries</div><div class="border-chips">'+borderChips+'</div></div>' : kv('Bordering countries','None'))+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Demographics</div>'+
      kv('Population', formatNumber(c.population))+
      kv('Population density', formatDensity(c.population, c.area))+
      kv('Languages', formatList(c.languages))+
      kv('Currency', formatCurrencies(c.currencies))+
      kv('Demonym', dash(c.demonym))+
      kv('Gini index (inequality)', c.gini ? (c.gini.value+' · '+c.gini.year) : 'Data unavailable')+
    '</div>'+

    '<div class="panel-section" id="economy-section"><div class="section-title">Economy (World Bank, live)</div>'+
      kv('GDP', 'Loading…', 'wb-gdp')+
      kv('GDP per capita', 'Loading…', 'wb-gdpPerCapita')+
      kv('GDP growth', 'Loading…', 'wb-gdpGrowth')+
      kv('Inflation', 'Loading…', 'wb-inflation')+
      kv('Unemployment', 'Loading…', 'wb-unemployment')+
    '</div>'+

    '<div class="panel-section" id="society-section"><div class="section-title">Society &amp; digital (World Bank, live)</div>'+
      kv('Internet usage', 'Loading…', 'wb-internetUsage')+
      kv('Life expectancy', 'Loading…', 'wb-lifeExpectancy')+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Codes &amp; misc</div>'+
      kv('Calling code(s)', formatList(c.callingCodes))+
      kv('Postal code format', dash(c.postalCodeFormat))+
      kv('Start of week', dash(c.startOfWeek))+
      kv('Vehicle sign(s)', formatList(c.carSigns))+
    '</div>'+

    '<button class="compare-btn" id="open-compare-btn">Compare to…</button>';
  }

  function statCard(label, value){
    return '<div class="stat-card"><div class="stat-label">'+esc(label)+'</div><div class="stat-value">'+esc(value)+'</div></div>';
  }
  function kv(label, value, id){
    return '<div class="kv-row"><div class="kv-label">'+esc(label)+'</div><div class="kv-value"'+(id?' id="'+id+'"':'')+'>'+esc(value)+'</div></div>';
  }

  async function loadEconomyData(country){
    if(!country.cca2) return;
    var cc = country.cca2.toLowerCase();
    var entries = Object.keys(WB_INDICATORS).map(function(k){ return [k, WB_INDICATORS[k]]; });
    var results = await Promise.allSettled(entries.map(function(pair){
      var code = pair[1];
      return fetch('https://api.worldbank.org/v2/country/'+cc+'/indicator/'+code+'?format=json&per_page=6')
        .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.json(); })
        .then(function(data){
          var series = data && data[1];
          if(!series) return null;
          var latest = series.find(function(d){ return d.value !== null; });
          return latest ? { value:latest.value, year:latest.date } : null;
        });
    }));
    entries.forEach(function(pair, i){
      var key = pair[0];
      var el = $('wb-'+key);
      if(!el) return;
      var res = results[i];
      var entry = (res.status === 'fulfilled') ? res.value : null;
      var opts = {};
      if(key==='gdp' || key==='gdpPerCapita') opts.money = true;
      if(key==='gdpGrowth' || key==='inflation' || key==='unemployment' || key==='internetUsage') opts.percent = true;
      el.textContent = entry ? formatWB(entry, opts) : 'Data unavailable';
    });
  }

  // ---------------- COMPARE MODAL ----------------
  var compareModal = $('compare-modal');
  var compareSearch = $('compare-search');
  var compareSearchResults = $('compare-search-results');

  function openCompareModal(a, b){
    state.compareA = a;
    state.compareB = b || null;
    compareModal.classList.add('open');
    compareSearch.value = '';
    compareSearchResults.innerHTML = '';
    renderCompareGrid();
    setTimeout(function(){ compareSearch.focus(); }, 50);
  }
  function closeCompareModal(){ compareModal.classList.remove('open'); }
  $('compare-close').addEventListener('click', closeCompareModal);
  compareModal.addEventListener('click', function(e){ if(e.target === compareModal) closeCompareModal(); });

  compareSearch.addEventListener('input', function(){
    var q = compareSearch.value.trim().toLowerCase();
    if(!q){ compareSearchResults.innerHTML=''; return; }
    var matches = state.atlas.countries.filter(function(c){
      return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.officialName||'').toLowerCase().indexOf(q)!==-1;
    }).slice(0,6);
    compareSearchResults.innerHTML = matches.map(function(c){
      var flag = c.flagPng || c.flagSvg || '';
      return '<div class="result-row" data-cca3="'+esc(c.cca3)+'">'+
        (flag ? '<img class="result-flag" src="'+esc(flag)+'" alt="">' : '<div class="result-flag"></div>')+
        '<div class="result-name">'+esc(c.name)+'</div>'+
        '<div class="result-region">'+esc(c.region||'')+'</div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(compareSearchResults.querySelectorAll('.result-row'), function(row){
      row.addEventListener('click', function(){
        var c = state.countryByISO.get(row.getAttribute('data-cca3'));
        if(!state.compareA){ state.compareA = c; }
        else { state.compareB = c; }
        compareSearchResults.innerHTML='';
        compareSearch.value='';
        renderCompareGrid();
      });
    });
  });

  function renderCompareCol(country){
    if(!country) return '<div class="compare-empty">Search and select a country to compare</div>';
    var flag = country.flagPng || country.flagSvg || '';
    var rows = [
      ['Population', formatPopulation(country.population)],
      ['Area', formatArea(country.area)],
      ['Density', formatDensity(country.population, country.area)],
      ['Capital', dash(country.capital)],
      ['Region', dash(country.region)],
      ['Subregion', dash(country.subregion)],
      ['Currency', formatCurrencies(country.currencies)],
      ['Languages', formatList(country.languages)],
      ['Time zones', formatList(country.timezones)],
      ['Calling code(s)', formatList(country.callingCodes)],
      ['Driving side', dash(country.drivingSide)],
      ['Gini index', country.gini ? (country.gini.value+' · '+country.gini.year) : '—'],
      ['Borders', String((country.borders||[]).length)],
      ['Landlocked', country.landlocked ? 'Yes':'No']
    ];
    return '<h3>'+esc(country.name)+'</h3>'+
      (flag ? '<img src="'+esc(flag)+'" style="width:100%;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;">' : '')+
      rows.map(function(r){ return '<div class="compare-row"><span>'+esc(r[0])+'</span><strong>'+esc(r[1])+'</strong></div>'; }).join('');
  }

  function renderCompareGrid(){
    $('compare-grid').innerHTML =
      '<div class="compare-col">'+renderCompareCol(state.compareA)+'</div>'+
      '<div class="compare-col">'+renderCompareCol(state.compareB)+'</div>';
  }

})();
</script>
</body>
</html>
