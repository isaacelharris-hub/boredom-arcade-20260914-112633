<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>World Atlas — Boredom Arcade</title>
<meta name="description" content="A premium interactive 3D world atlas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl"></script>
<style>
  :root{
    --bg:#f7f6f3;
    --bg-2:#efeee9;
    --ink:#1c1c1a;
    --ink-soft:#5c5b57;
    --line:#e2e0da;
    --glass:rgba(255,255,255,0.62);
    --glass-strong:rgba(255,255,255,0.86);
    --shadow:0 8px 30px rgba(20,20,18,0.10);
    --shadow-soft:0 2px 10px rgba(20,20,18,0.06);
    --radius:16px;
    --radius-sm:10px;
    --accent:#1c1c1a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
  }
  button{font-family:inherit;}
  #scene{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 40%, #fbfaf8 0%, var(--bg) 70%);}
  #scene canvas{outline:none;}

  /* ---------- Loading ---------- */
  #loading{
    position:fixed;inset:0;z-index:500;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loading.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .loading-title{font-size:13px;letter-spacing:.24em;font-weight:700;color:var(--ink-soft);margin-bottom:14px;}
  .loading-sub{font-size:15px;color:var(--ink);margin-bottom:26px;}
  .loading-bar{width:180px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;}
  .loading-bar span{display:block;width:40%;height:100%;background:var(--ink);border-radius:2px;animation:loadmove 1.1s ease-in-out infinite;}
  @keyframes loadmove{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
  .loading-error{max-width:360px;text-align:center;display:none;}
  .loading-error.show{display:block;}
  .loading-error h3{margin:0 0 8px;font-size:17px;}
  .loading-error p{margin:0 0 18px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
  .loading-error button{
    padding:10px 20px;border-radius:999px;border:1px solid var(--line);
    background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* ---------- UI overlay ---------- */
  #ui{position:fixed;inset:0;z-index:20;pointer-events:none;padding:22px;display:flex;flex-direction:column;}
  #ui .interactive, #ui button, #ui input, #ui a{pointer-events:auto;}

  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .brand{pointer-events:auto;user-select:none;}
  .brand .b1{font-size:10.5px;letter-spacing:.22em;font-weight:700;color:var(--ink-soft);}
  .brand .b2{font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--ink);margin-top:2px;}

  .search-shell{
    pointer-events:auto;position:relative;z-index:100;
    width:min(480px,92vw);
    background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--line);border-radius:999px;
    box-shadow:var(--shadow-soft);
    display:flex;align-items:center;gap:10px;padding:11px 16px;
    transition:box-shadow .25s ease, border-color .25s ease, background .25s ease;
  }
  .search-shell:focus-within{box-shadow:var(--shadow);border-color:#cfcdc6;background:var(--glass-strong);}
  .search-icon{font-size:15px;color:var(--ink-soft);flex:none;}
  #search{
    flex:1;border:none;outline:none;background:transparent;
    font-size:14px;color:var(--ink);
    position:relative;z-index:100;pointer-events:auto;
  }
  #search::placeholder{color:#98968f;}
  .kbd{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:2px 6px;flex:none;background:rgba(255,255,255,.5);}

  .status-pill{
    pointer-events:auto;align-self:flex-start;
    font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--ink-soft);
    background:var(--glass);border:1px solid var(--line);border-radius:999px;
    padding:7px 12px;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:#3fb95f;flex:none;}
  .status-pill.loading .status-dot{background:#c9a227;}
  .status-pill.fallback .status-dot{background:#c9622a;}

  #search-results{
    position:absolute;top:calc(100% + 8px);left:0;right:0;
    background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
    max-height:340px;overflow-y:auto;
    opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  #search-results.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .result-row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;}
  .result-row:hover,.result-row.active{background:rgba(0,0,0,0.045);}
  .result-flag{width:22px;height:16px;object-fit:cover;border-radius:3px;border:1px solid var(--line);flex:none;background:#eee;}
  .result-name{font-size:13.5px;font-weight:600;}
  .result-region{font-size:11.5px;color:var(--ink-soft);margin-left:auto;}
  .result-empty{padding:16px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .controls{
    pointer-events:auto;margin-top:auto;align-self:flex-start;
    display:flex;gap:8px;
  }
  .ctrl-btn{
    background:var(--glass);border:1px solid var(--line);border-radius:999px;
    padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .ctrl-btn:hover{background:var(--glass-strong);}
  .ctrl-btn:active{transform:scale(.97);}

  /* ---------- Tooltip ---------- */
  #tooltip{
    position:fixed;z-index:200;pointer-events:none;
    background:rgba(28,28,26,0.92);color:#fff;
    padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.45;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    opacity:0;transform:translateY(4px) scale(.98);
    transition:opacity .15s ease, transform .15s ease;
    max-width:200px;
  }
  #tooltip.visible{opacity:1;transform:translateY(0) scale(1);}
  .tip-name{font-weight:700;font-size:13px;}
  .tip-region{color:#c9c8c4;font-size:11px;margin-top:1px;}
  .tip-pop{color:#c9c8c4;font-size:11px;margin-top:3px;}

  /* ---------- Country panel ---------- */
  #country-panel{
    position:fixed;top:0;right:0;height:100%;width:min(440px,100vw);
    background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-left:1px solid var(--line);box-shadow:-10px 0 40px rgba(0,0,0,.08);
    z-index:60;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
    overflow-y:auto;padding:26px 24px 60px;
  }
  #country-panel.open{transform:translateX(0);}
  .panel-close{
    position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;
    border:1px solid var(--line);background:rgba(255,255,255,.7);cursor:pointer;
    font-size:15px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;
  }
  .panel-flag{width:100%;height:130px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);background:#eee;}
  .panel-name{font-size:24px;font-weight:800;margin-top:16px;}
  .panel-official{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .panel-quick{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .chip{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.045);border:1px solid var(--line);border-radius:999px;padding:5px 10px;}
  .panel-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .stat-card{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;}
  .stat-label{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;}
  .stat-value{font-size:17px;font-weight:700;margin-top:4px;}
  .stat-sub{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .panel-section{margin-top:26px;}
  .section-title{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-bottom:10px;}
  .kv-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-label{color:var(--ink-soft);}
  .kv-value{font-weight:600;text-align:right;}
  .compare-btn{
    margin-top:26px;width:100%;padding:12px;border-radius:999px;border:1px solid var(--ink);
    background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .compare-btn:hover{opacity:.92;}

  /* ---------- Compare modal ---------- */
  #compare-modal{
    position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
    background:rgba(20,20,18,.32);backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s ease;
  }
  #compare-modal.open{opacity:1;visibility:visible;}
  .compare-box{
    width:min(880px,94vw);max-height:86vh;overflow-y:auto;background:var(--glass-strong);
    border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    padding:26px;position:relative;transform:translateY(14px);transition:transform .3s ease;
  }
  #compare-modal.open .compare-box{transform:translateY(0);}
  .compare-search{
    width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.7);font-size:14px;margin-bottom:16px;outline:none;
  }
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .compare-col{background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:120px;}
  .compare-col h3{margin:0 0 4px;font-size:17px;}
  .compare-empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:30px 10px;}
  .compare-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);}
  .compare-row:last-child{border-bottom:none;}

  /* ---------- Directory (fallback) ---------- */
  #directory-modal{
    position:fixed;inset:0;z-index:90;background:var(--bg);display:none;flex-direction:column;padding:24px;
  }
  #directory-modal.open{display:flex;}
  .directory-grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;overflow-y:auto;padding-bottom:40px;}
  .dir-card{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;cursor:pointer;background:rgba(255,255,255,.6);display:flex;gap:10px;align-items:center;}
  .dir-card:hover{background:rgba(255,255,255,.9);}
  .dir-flag{width:28px;height:20px;object-fit:cover;border-radius:3px;border:1px solid var(--line);}
  .dir-name{font-size:13px;font-weight:600;}
  .dir-region{font-size:11px;color:var(--ink-soft);}

  /* ---------- Responsive ---------- */
  @media (max-width:720px){
    #country-panel{width:100%;top:auto;bottom:0;height:82vh;border-left:none;border-top:1px solid var(--line);
      border-radius:22px 22px 0 0;transform:translateY(100%);}
    #country-panel.open{transform:translateY(0);}
    .compare-grid{grid-template-columns:1fr;}
    .search-shell{width:88vw;}
    .topbar{flex-direction:column;gap:12px;}
  }
</style>
</head>
<body>

<div id="scene"></div>

<div id="loading">
  <div class="loading-title">WORLD ATLAS</div>
  <div class="loading-sub" id="loading-text">Loading geographic data…</div>
  <div class="loading-bar"><span></span></div>
  <div class="loading-error" id="loading-error">
    <h3>Atlas couldn't finish loading</h3>
    <p>The core atlas data could not be initialized. You can retry, or continue with the country directory.</p>
    <button id="retry-btn">Retry</button>
  </div>
</div>

<div id="ui">
  <div class="topbar">
    <div class="brand interactive">
      <div class="b1">BOREDOM ARCADE</div>
      <div class="b2">World Atlas</div>
    </div>
    <div class="status-pill loading interactive" id="status-pill">
      <span class="status-dot"></span><span id="status-text">LOADING ATLAS</span>
    </div>
  </div>

  <div style="display:flex;justify-content:center;margin-top:8px;">
    <div class="search-shell interactive">
      <span class="search-icon">⌕</span>
      <input id="search" type="text" placeholder="Search countries..." autocomplete="off" aria-label="Search countries">
      <span class="kbd">⌘K</span>
      <div id="search-results"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btn-directory" aria-label="Open country directory">Countries</button>
    <button class="ctrl-btn" id="btn-random" aria-label="Select random country">Random country</button>
    <button class="ctrl-btn" id="btn-reset" aria-label="Reset globe">Reset globe</button>
  </div>
</div>

<div id="tooltip"></div>

<div id="country-panel"></div>

<div id="compare-modal">
  <div class="compare-box">
    <button class="panel-close" id="compare-close" style="position:absolute;top:16px;right:16px;">✕</button>
    <h2 style="margin:0 0 14px;font-size:18px;">Compare countries</h2>
    <input class="compare-search" id="compare-search" placeholder="Search countries..." autocomplete="off">
    <div id="compare-search-results"></div>
    <div class="compare-grid" id="compare-grid"></div>
  </div>
</div>

<div id="directory-modal">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div class="b2" style="font-size:18px;">Country directory</div>
    <button class="panel-close" id="directory-close" style="position:static;">✕</button>
  </div>
  <input class="compare-search" id="directory-search" placeholder="Search countries..." style="margin-top:14px;max-width:420px;">
  <div class="directory-grid" id="directory-grid"></div>
</div>

<script>
(function(){
  "use strict";

  var state = {
    atlas:null,
    countryByISO:new Map(),
    globe:null,
    controls:null,
    hovered:null,
    selected:null,
    flagMaterialCache:new Map(),
    greyMaterial:null,
    searchIndex:[],
    searchActiveIndex:-1,
    compareA:null,
    compareB:null,
    fallbackMode:false
  };

  var WB_INDICATORS = {
    gdp:'NY.GDP.MKTP.CD',
    gdpPerCapita:'NY.GDP.PCAP.CD',
    gdpGrowth:'NY.GDP.MKTP.KD.ZG',
    inflation:'FP.CPI.TOTL.ZG',
    unemployment:'SL.UEM.TOTL.ZS',
    internetUsage:'IT.NET.USER.ZS',
    lifeExpectancy:'SP.DYN.LE00.IN'
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){
    if(s===null||s===undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function dash(v){ return (v===null||v===undefined||v==='' ) ? '—' : v; }

  function formatPopulation(n){
    if(n===null||n===undefined) return '—';
    if(n>=1e9) return (n/1e9).toFixed(1)+'B';
    if(n>=1e6) return (n/1e6).toFixed(1)+'M';
    if(n>=1e3) return (n/1e3).toFixed(1)+'K';
    return String(n);
  }
  function formatNumber(n){
    if(n===null||n===undefined) return '—';
    return Number(n).toLocaleString('en-US');
  }
  function formatArea(n){
    if(n===null||n===undefined) return '—';
    return Number(n).toLocaleString('en-US')+' km²';
  }
  function formatCurrencies(list){
    if(!list||!list.length) return '—';
    return list.map(function(c){ return c.name ? (c.name+' ('+c.code+')') : c.code; }).join(', ');
  }
  function formatLanguages(list){
    if(!list||!list.length) return '—';
    return list.join(', ');
  }
  function formatBorders(codes){
    if(!codes||!codes.length) return [];
    return codes.map(function(code){
      var c = state.countryByISO.get(code);
      return c ? c.name : code;
    });
  }
  function formatTimezones(list){
    if(!list||!list.length) return '—';
    return list.join(', ');
  }
  function formatCoords(latlng){
    if(!latlng||latlng.length<2) return '—';
    return latlng[0].toFixed(2)+'°, '+latlng[1].toFixed(2)+'°';
  }
  function formatWB(entry, opts){
    opts = opts || {};
    if(!entry || entry.value===null || entry.value===undefined) return 'Data unavailable';
    var v = entry.value;
    var str;
    if(opts.money){
      if(Math.abs(v)>=1e12) str = '$'+(v/1e12).toFixed(2)+'T';
      else if(Math.abs(v)>=1e9) str = '$'+(v/1e9).toFixed(2)+'B';
      else if(Math.abs(v)>=1e6) str = '$'+(v/1e6).toFixed(2)+'M';
      else str = '$'+formatNumber(Math.round(v));
    } else if(opts.percent){
      str = v.toFixed(1)+'%';
    } else {
      str = formatNumber(Math.round(v*10)/10);
    }
    return str + (entry.year ? ' · '+entry.year : '');
  }

  function setStatus(text, mode){
    var pill = $('status-pill');
    $('status-text').textContent = text;
    pill.classList.remove('loading','fallback');
    if(mode) pill.classList.add(mode);
  }

  function hideLoading(){
    $('loading').classList.add('hidden');
  }
  function showLoadingError(){
    $('loading-error').classList.add('show');
    $('loading-text').style.display = 'none';
    document.querySelector('.loading-bar').style.display = 'none';
  }

  // ---------------- BOOT ----------------
  async function boot(){
    try{
      setStatus('LOADING ATLAS','loading');
      var res = await fetch('./atlas-data.json');
      if(!res.ok) throw new Error('atlas-data.json fetch failed: '+res.status);
      var atlas = await res.json();
      state.atlas = atlas;

      atlas.countries.forEach(function(c){
        state.countryByISO.set(c.cca3, c);
        state.searchIndex.push({
          key:(c.name||'')+' '+(c.officialName||'')+' '+(c.cca2||'')+' '+(c.cca3||''),
          country:c
        });
      });

      buildDirectory();

      if(window.THREE && window.Globe){
        initGlobe(atlas);
        setStatus('ATLAS ONLINE');
      } else {
        throw new Error('3D engine unavailable');
      }
    }catch(err){
      console.error(err);
      enterFallbackMode();
    }finally{
      hideLoading();
    }
  }

  function enterFallbackMode(){
    state.fallbackMode = true;
    setStatus('DIRECTORY MODE','fallback');
    $('scene').innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;">'+
      '<div style="font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--ink-soft);margin-bottom:8px;">3D GLOBE UNAVAILABLE</div>'+
      '<div style="font-size:14px;color:var(--ink-soft);max-width:320px;">The atlas directory is still available. Use search or the Countries button below.</div>'+
      '</div>';
    if(state.atlas){
      openDirectory();
    }
  }

  boot();
  $('retry-btn').addEventListener('click', function(){
    $('loading-error').classList.remove('show');
    $('loading-text').style.display='';
    document.querySelector('.loading-bar').style.display='';
    boot();
  });

  // ---------------- GLOBE ----------------
  function greyMaterial(){
    if(!state.greyMaterial){
      state.greyMaterial = new THREE.MeshLambertMaterial({ color:0xd9dbe0, transparent:true, opacity:0.92 });
    }
    return state.greyMaterial;
  }

  function materialForFeature(feat){
    var isHovered = feat === state.hovered;
    if(!isHovered) return greyMaterial();
    var iso = feat.properties && feat.properties.CCA3;
    var country = iso && state.countryByISO.get(iso);
    var flagUrl = country && (country.flagPng || country.flagSvg);
    if(!flagUrl) return greyMaterial();
    if(state.flagMaterialCache.has(iso)) return state.flagMaterialCache.get(iso);
    var mat = new THREE.MeshLambertMaterial({ color:0xffffff });
    var loader = new THREE.TextureLoader();
    loader.crossOrigin = 'anonymous';
    loader.load(flagUrl, function(tex){
      mat.map = tex;
      mat.needsUpdate = true;
      refreshPolygons();
    }, undefined, function(){ /* keep grey on failure */ });
    state.flagMaterialCache.set(iso, mat);
    return mat;
  }

  function refreshPolygons(){
    if(state.globe) state.globe.polygonsData(state.atlas.geojson.features);
  }

  function initGlobe(atlas){
    var el = $('scene');
    var world = Globe()(el)
      .backgroundColor('rgba(0,0,0,0)')
      .showGlobe(true)
      .globeMaterial(new THREE.MeshLambertMaterial({ color:0xf3f2ee }))
      .showAtmosphere(true)
      .atmosphereColor('#dcdfe4')
      .atmosphereAltitude(0.16)
      .polygonsData(atlas.geojson.features)
      .polygonCapMaterial(materialForFeature)
      .polygonSideColor(function(){ return 'rgba(190,190,190,0.15)'; })
      .polygonStrokeColor(function(){ return '#b7b5ae'; })
      .polygonAltitude(function(feat){ return feat === state.hovered ? 0.045 : 0.01; })
      .polygonsTransitionDuration(300)
      .onPolygonHover(handleHover)
      .onPolygonClick(handleClick);

    world.pointOfView({ lat:22, lng:12, altitude:2.1 }, 0);

    var controls = world.controls();
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.enableDamping = true;

    state.globe = world;
    state.controls = controls;

    window.addEventListener('resize', function(){
      world.width(el.clientWidth).height(el.clientHeight);
    });
  }

  function handleHover(feat){
    state.hovered = feat || null;
    if(state.controls) state.controls.autoRotate = !feat && !state.selected;
    if(feat){
      var iso = feat.properties && feat.properties.CCA3;
      var country = state.countryByISO.get(iso);
      showTooltip(country);
    } else {
      hideTooltip();
    }
    refreshPolygons();
  }

  function handleClick(feat){
    if(!feat) return;
    var iso = feat.properties && feat.properties.CCA3;
    var country = state.countryByISO.get(iso);
    if(country) openCountryPanel(country);
  }

  document.addEventListener('mousemove', function(e){
    var tip = $('tooltip');
    if(tip.classList.contains('visible')){
      tip.style.left = (e.clientX + 16) + 'px';
      tip.style.top = (e.clientY + 16) + 'px';
    }
  });

  function showTooltip(country){
    if(!country) return;
    var tip = $('tooltip');
    tip.innerHTML =
      '<div class="tip-name">'+esc(country.name)+'</div>'+
      '<div class="tip-region">'+esc(country.region||'—')+'</div>'+
      '<div class="tip-pop">Population '+esc(formatPopulation(country.population))+'</div>';
    tip.classList.add('visible');
  }
  function hideTooltip(){ $('tooltip').classList.remove('visible'); }

  // ---------------- SEARCH ----------------
  var searchInput = $('search');
  var searchResults = $('search-results');

  function runSearch(q){
    q = q.trim().toLowerCase();
    if(!q){ closeSearchResults(); return; }
    var matches = state.searchIndex.filter(function(item){
      return item.key.toLowerCase().indexOf(q) !== -1;
    }).slice(0,8);
    renderSearchResults(matches.map(function(m){ return m.country; }));
  }

  function renderSearchResults(list){
    state.searchActiveIndex = -1;
    if(!list.length){
      searchResults.innerHTML = '<div class="result-empty">No countries found</div>';
      searchResults.classList.add('open');
      return;
    }
    searchResults.innerHTML = list.map(function(c, i){
      var flag = c.flagPng || c.flagSvg || '';
      return '<div class="result-row" data-cca3="'+esc(c.cca3)+'" data-index="'+i+'">'+
        (flag ? '<img class="result-flag" src="'+esc(flag)+'" alt="">' : '<div class="result-flag"></div>')+
        '<div class="result-name">'+esc(c.name)+'</div>'+
        '<div class="result-region">'+esc(c.region||'')+'</div>'+
      '</div>';
    }).join('');
    searchResults.classList.add('open');
    Array.prototype.forEach.call(searchResults.querySelectorAll('.result-row'), function(row){
      row.addEventListener('click', function(){
        var c = state.countryByISO.get(row.getAttribute('data-cca3'));
        if(c) selectFromSearch(c);
      });
    });
  }

  function closeSearchResults(){
    searchResults.classList.remove('open');
    searchResults.innerHTML = '';
    state.searchActiveIndex = -1;
  }

  function selectFromSearch(country){
    openCountryPanel(country);
    closeSearchResults();
    searchInput.value = country.name;
    searchInput.blur();
    focusGlobeOn(country);
  }

  function focusGlobeOn(country){
    if(state.globe && country.latlng && country.latlng.length===2){
      state.globe.pointOfView({ lat:country.latlng[0], lng:country.latlng[1], altitude:1.6 }, 900);
    }
  }

  searchInput.addEventListener('input', function(){ runSearch(searchInput.value); });
  searchInput.addEventListener('keydown', function(e){
    var rows = searchResults.querySelectorAll('.result-row');
    if(e.key === 'ArrowDown'){
      e.preventDefault();
      if(!rows.length) return;
      state.searchActiveIndex = Math.min(state.searchActiveIndex+1, rows.length-1);
      highlightActive(rows);
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      if(!rows.length) return;
      state.searchActiveIndex = Math.max(state.searchActiveIndex-1, 0);
      highlightActive(rows);
    } else if(e.key === 'Enter'){
      e.preventDefault();
      var target = rows[state.searchActiveIndex >= 0 ? state.searchActiveIndex : 0];
      if(target){
        var c = state.countryByISO.get(target.getAttribute('data-cca3'));
        if(c) selectFromSearch(c);
      }
    } else if(e.key === 'Escape'){
      closeSearchResults();
      searchInput.blur();
    }
  });
  function highlightActive(rows){
    Array.prototype.forEach.call(rows, function(r,i){
      r.classList.toggle('active', i===state.searchActiveIndex);
    });
  }
  document.addEventListener('click', function(e){
    if(!e.target.closest('.search-shell')) closeSearchResults();
  });

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if((e.key === '/' && tag !== 'INPUT') || ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k')){
      e.preventDefault();
      searchInput.focus();
    } else if(e.key === 'Escape'){
      closeSearchResults();
      closeCompareModal();
      closeCountryPanel();
    }
  });

  // ---------------- COUNTRY PANEL ----------------
  var panel = $('country-panel');

  function openCountryPanel(country){
    state.selected = country;
    if(state.controls) state.controls.autoRotate = false;
    panel.innerHTML = renderPanelHTML(country);
    panel.classList.add('open');
    $('panel-close-btn').addEventListener('click', closeCountryPanel);
    $('open-compare-btn').addEventListener('click', function(){ openCompareModal(country); });
    focusGlobeOn(country);
    loadEconomyData(country);
  }
  function closeCountryPanel(){
    panel.classList.remove('open');
    state.selected = null;
    if(state.controls && !state.hovered) state.controls.autoRotate = true;
  }

  function renderPanelHTML(c){
    var borders = formatBorders(c.borders);
    var flag = c.flagPng || c.flagSvg || '';
    return ''+
    '<button class="panel-close" id="panel-close-btn" aria-label="Close panel">✕</button>'+
    (flag ? '<img class="panel-flag" src="'+esc(flag)+'" alt="Flag of '+esc(c.name)+'">' : '')+
    '<div class="panel-name">'+esc(c.name)+'</div>'+
    '<div class="panel-official">'+esc(c.officialName||'')+'</div>'+
    '<div class="panel-quick">'+
      '<span class="chip">'+esc(c.cca2||'—')+' / '+esc(c.cca3||'—')+'</span>'+
      (c.unMember ? '<span class="chip">UN member</span>' : '')+
      (c.landlocked ? '<span class="chip">Landlocked</span>' : '')+
    '</div>'+
    '<div class="panel-stats">'+
      statCard('Population', formatPopulation(c.population))+
      statCard('Area', formatArea(c.area))+
      statCard('Capital', dash(c.capital))+
      statCard('Region', dash(c.region))+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Identity</div>'+
      kv('Official name', dash(c.officialName))+
      kv('ISO alpha-2', dash(c.cca2))+
      kv('ISO alpha-3', dash(c.cca3))+
      kv('Continent', dash((c.continents||[]).join(', ')))+
      kv('Subregion', dash(c.subregion))+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Geography</div>'+
      kv('Coordinates', formatCoords(c.latlng))+
      kv('Time zones', formatTimezones(c.timezones))+
      kv('Landlocked', c.landlocked ? 'Yes' : 'No')+
      kv('Borders', borders.length ? borders.join(', ') : 'None')+
    '</div>'+

    '<div class="panel-section"><div class="section-title">Demographics</div>'+
      kv('Population', formatNumber(c.population))+
      kv('Languages', formatLanguages(c.languages))+
      kv('Currency', formatCurrencies(c.currencies))+
      kv('Bordering countries', String(borders.length))+
    '</div>'+

    '<div class="panel-section" id="economy-section"><div class="section-title">Economy</div>'+
      kv('GDP', 'Loading…', 'wb-gdp')+
      kv('GDP per capita', 'Loading…', 'wb-gdpPerCapita')+
      kv('GDP growth', 'Loading…', 'wb-gdpGrowth')+
      kv('Inflation', 'Loading…', 'wb-inflation')+
      kv('Unemployment', 'Loading…', 'wb-unemployment')+
    '</div>'+

    '<div class="panel-section" id="society-section"><div class="section-title">Society &amp; digital</div>'+
      kv('Internet usage', 'Loading…', 'wb-internetUsage')+
      kv('Life expectancy', 'Loading…', 'wb-lifeExpectancy')+
    '</div>'+

    '<button class="compare-btn" id="open-compare-btn">Compare to…</button>';
  }

  function statCard(label, value){
    return '<div class="stat-card"><div class="stat-label">'+esc(label)+'</div><div class="stat-value">'+esc(value)+'</div></div>';
  }
  function kv(label, value, id){
    return '<div class="kv-row"><div class="kv-label">'+esc(label)+'</div><div class="kv-value"'+(id?' id="'+id+'"':'')+'>'+esc(value)+'</div></div>';
  }

  async function loadEconomyData(country){
    if(!country.cca2) return;
    var cc = country.cca2.toLowerCase();
    var entries = Object.keys(WB_INDICATORS).map(function(k){ return [k, WB_INDICATORS[k]]; });
    var results = await Promise.allSettled(entries.map(function(pair){
      var code = pair[1];
      return fetch('https://api.worldbank.org/v2/country/'+cc+'/indicator/'+code+'?format=json&per_page=6')
        .then(function(r){ if(!r.ok) throw new Error('bad status'); return r.json(); })
        .then(function(data){
          var series = data && data[1];
          if(!series) return null;
          var latest = series.find(function(d){ return d.value !== null; });
          return latest ? { value:latest.value, year:latest.date } : null;
        });
    }));
    entries.forEach(function(pair, i){
      var key = pair[0];
      var el = $('wb-'+key);
      if(!el) return;
      var res = results[i];
      var entry = (res.status === 'fulfilled') ? res.value : null;
      var opts = {};
      if(key==='gdp' || key==='gdpPerCapita') opts.money = true;
      if(key==='gdpGrowth' || key==='inflation' || key==='unemployment' || key==='internetUsage') opts.percent = true;
      el.textContent = entry ? formatWB(entry, opts) : 'Data unavailable';
    });
  }

  // ---------------- COMPARE ----------------
  var compareModal = $('compare-modal');
  var compareSearch = $('compare-search');
  var compareSearchResults = $('compare-search-results');

  function openCompareModal(country){
    state.compareA = country;
    state.compareB = null;
    compareModal.classList.add('open');
    compareSearch.value = '';
    compareSearchResults.innerHTML = '';
    renderCompareGrid();
    setTimeout(function(){ compareSearch.focus(); }, 50);
  }
  function closeCompareModal(){
    compareModal.classList.remove('open');
  }
  $('compare-close').addEventListener('click', closeCompareModal);
  compareModal.addEventListener('click', function(e){
    if(e.target === compareModal) closeCompareModal();
  });

  compareSearch.addEventListener('input', function(){
    var q = compareSearch.value.trim().toLowerCase();
    if(!q){ compareSearchResults.innerHTML=''; return; }
    var matches = state.searchIndex.filter(function(item){
      return item.key.toLowerCase().indexOf(q) !== -1;
    }).slice(0,6).map(function(m){ return m.country; });
    compareSearchResults.innerHTML = matches.map(function(c){
      var flag = c.flagPng || c.flagSvg || '';
      return '<div class="result-row" data-cca3="'+esc(c.cca3)+'" style="border-radius:10px;">'+
        (flag ? '<img class="result-flag" src="'+esc(flag)+'" alt="">' : '<div class="result-flag"></div>')+
        '<div class="result-name">'+esc(c.name)+'</div>'+
        '<div class="result-region">'+esc(c.region||'')+'</div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(compareSearchResults.querySelectorAll('.result-row'), function(row){
      row.addEventListener('click', function(){
        state.compareB = state.countryByISO.get(row.getAttribute('data-cca3'));
        compareSearchResults.innerHTML='';
        compareSearch.value='';
        renderCompareGrid();
      });
    });
  });

  function compareRow(label, a, b){
    return '<div class="compare-row"><span>'+esc(label)+'</span></div>'+
      '<div style="display:none"></div>';
  }

  function renderCompareCol(country){
    if(!country){
      return '<div class="compare-empty">Search and select a country to compare</div>';
    }
    var flag = country.flagPng || country.flagSvg || '';
    var rows = [
      ['Population', formatPopulation(country.population)],
      ['Area', formatArea(country.area)],
      ['Capital', dash(country.capital)],
      ['Region', dash(country.region)],
      ['Subregion', dash(country.subregion)],
      ['Currency', formatCurrencies(country.currencies)],
      ['Languages', formatLanguages(country.languages)],
      ['Time zones', formatTimezones(country.timezones)],
      ['Borders', String((country.borders||[]).length)],
      ['Landlocked', country.landlocked ? 'Yes':'No']
    ];
    return '<h3>'+esc(country.name)+'</h3>'+
      (flag ? '<img src="'+esc(flag)+'" style="width:100%;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-bottom:10px;">' : '')+
      rows.map(function(r){
        return '<div class="compare-row"><span>'+esc(r[0])+'</span><strong>'+esc(r[1])+'</strong></div>';
      }).join('');
  }

  function renderCompareGrid(){
    $('compare-grid').innerHTML =
      '<div class="compare-col">'+renderCompareCol(state.compareA)+'</div>'+
      '<div class="compare-col">'+renderCompareCol(state.compareB)+'</div>';
  }

  // ---------------- DIRECTORY (fallback + button) ----------------
  var directoryModal = $('directory-modal');
  var directoryGrid = $('directory-grid');
  var directorySearch = $('directory-search');

  function buildDirectory(){
    renderDirectory(state.atlas.countries);
  }
  function renderDirectory(list){
    directoryGrid.innerHTML = list.map(function(c){
      var flag = c.flagPng || c.flagSvg || '';
      return '<div class="dir-card" data-cca3="'+esc(c.cca3)+'">'+
        (flag ? '<img class="dir-flag" src="'+esc(flag)+'" alt="">' : '<div class="dir-flag"></div>')+
        '<div><div class="dir-name">'+esc(c.name)+'</div><div class="dir-region">'+esc(c.region||'')+'</div></div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(directoryGrid.querySelectorAll('.dir-card'), function(card){
      card.addEventListener('click', function(){
        var c = state.countryByISO.get(card.getAttribute('data-cca3'));
        if(c){ openCountryPanel(c); closeDirectory(); }
      });
    });
  }
  directorySearch.addEventListener('input', function(){
    var q = directorySearch.value.trim().toLowerCase();
    var list = !q ? state.atlas.countries : state.atlas.countries.filter(function(c){
      return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.officialName||'').toLowerCase().indexOf(q)!==-1;
    });
    renderDirectory(list);
  });
  function openDirectory(){ directoryModal.classList.add('open'); }
  function closeDirectory(){ directoryModal.classList.remove('open'); }
  $('btn-directory').addEventListener('click', openDirectory);
  $('directory-close').addEventListener('click', closeDirectory);

  // ---------------- OTHER CONTROLS ----------------
  $('btn-random').addEventListener('click', function(){
    if(!state.atlas) return;
    var list = state.atlas.countries;
    var pick = list[Math.floor(Math.random()*list.length)];
    if(pick) openCountryPanel(pick);
  });
  $('btn-reset').addEventListener('click', function(){
    closeCountryPanel();
    closeCompareModal();
    closeDirectory();
    state.hovered = null;
    if(state.globe){
      state.globe.pointOfView({ lat:22, lng:12, altitude:2.1 }, 900);
      refreshPolygons();
    }
    if(state.controls) state.controls.autoRotate = true;
  });

})();
</script>
</body>
</html>
