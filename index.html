<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>World Atlas — Boredom Arcade</title>
<meta name="description" content="A fast, polished world country atlas with flags and full available data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f2;--surface:rgba(255,255,255,.82);--surface2:#fff;--ink:#171716;--muted:#6c6b67;
  --line:#dfded8;--accent:#171716;--good:#2e9b58;--radius:18px;
  --ease:cubic-bezier(.22,1,.36,1);--shadow:0 14px 45px rgba(18,18,16,.08)
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:
radial-gradient(circle at 15% 10%,rgba(0,0,0,.035),transparent 28%),var(--bg)}
button,input,select{font:inherit}button{color:inherit}img{display:block}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{padding:14px 18px 12px;border-bottom:1px solid var(--line);background:rgba(245,245,242,.84);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5}
.top{display:flex;align-items:center;gap:14px}.brand{min-width:170px}.eyebrow{font-size:9px;letter-spacing:.22em;font-weight:800;color:var(--muted)}.title{font-size:18px;font-weight:800;margin-top:1px}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px rgba(46,155,88,.09)}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:11px}.search{flex:1;position:relative}.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.68);outline:0;padding:0 38px;font-size:13px;transition:.22s var(--ease)}.search input:focus{background:#fff;border-color:#bbb9b1;box-shadow:0 5px 18px rgba(0,0,0,.05)}.search-icon{position:absolute;left:14px;top:11px;color:var(--muted)}
select,.btn{height:40px;border:1px solid var(--line);background:rgba(255,255,255,.68);border-radius:12px;padding:0 12px;font-size:12px;font-weight:700;outline:0;cursor:pointer;transition:transform .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease)}.btn:hover,select:hover{background:#fff;box-shadow:0 5px 16px rgba(0,0,0,.05)}.btn:active{transform:scale(.97)}.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow:auto;padding-top:9px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:rgba(255,255,255,.5);border-radius:999px;padding:6px 10px;font-size:10.5px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.18s var(--ease)}.chip:hover{background:#fff}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:10.5px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(360px,1.15fr) minmax(430px,.85fr);min-height:0;height:100%}
.listPane{min-width:0;min-height:0;overflow:auto;padding:14px 16px 24px;scroll-behavior:smooth}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;align-content:start}
.card{position:relative;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:9px;cursor:pointer;overflow:hidden;transform:translateZ(0);transition:transform .24s var(--ease),box-shadow .24s var(--ease),border-color .24s var(--ease),background .24s var(--ease);animation:cardIn .42s var(--ease) both;will-change:transform}
.card:hover{transform:translateY(-3px);background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.07);border-color:#c9c7c0}.card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.card-flag{width:100%;aspect-ratio:1.58/1;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#e9e9e5}.card-info{padding:7px 2px 1px}.name{font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-bottom{display:flex;justify-content:space-between;gap:6px;font-size:9px;color:var(--muted);margin-top:6px}.check{position:absolute;right:12px;top:12px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);display:none;align-items:center;justify-content:center;font-size:11px;font-weight:900}.compare .check{display:flex}.selected .check{background:var(--accent);color:#fff;border-color:var(--accent)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.detailPane{min-width:0;min-height:0;border-left:1px solid var(--line);background:rgba(255,255,255,.34);overflow:auto;padding:20px 24px 40px;scroll-behavior:smooth}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.detailHero{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.heroFlag{width:180px;aspect-ratio:1.58/1;object-fit:cover;border-radius:15px;border:1px solid var(--line);background:#e9e9e5;box-shadow:var(--shadow)}.countryTitle{font-size:28px;line-height:1.05;font-weight:800;letter-spacing:-.03em}.official{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.badge{font-size:9.5px;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.65)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.stat{border:1px solid var(--line);background:rgba(255,255,255,.64);border-radius:13px;padding:10px}.stat label{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}.stat b{display:block;font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section{margin-top:18px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.sectionHead h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:900}.sectionHead span{font-size:9px;color:var(--muted)}.kv{display:grid;grid-template-columns:145px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid rgba(223,222,216,.75);font-size:11px}.kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:650;text-align:right;word-break:break-word}.taglist{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.tag{font-size:9px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;background:#fff}
.raw{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.64);overflow:hidden}.raw summary{cursor:pointer;padding:11px 12px;font-size:11px;font-weight:800;list-style:none}.raw summary::-webkit-details-marker{display:none}.raw summary:after{content:"＋";float:right;color:var(--muted)}.raw[open] summary:after{content:"−"}.raw pre{margin:0;padding:12px;border-top:1px solid var(--line);font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.compareView{display:none}.compareMode .compareView{display:block}.compareMode .normalView{display:none}.compareCols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compareCol{border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.68);padding:12px;min-width:0}.compareCol h3{margin:0 0 8px;font-size:15px}.compareFlag{width:100%;aspect-ratio:1.58/1;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin-bottom:8px}.compareRow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:6px 0;font-size:10px}.compareRow span{color:var(--muted)}.compareRow b{text-align:right}.hint{font-size:10px;color:var(--muted);margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#171716;color:#fff;padding:9px 13px;border-radius:999px;font-size:10px;font-weight:700;z-index:30;transition:.3s var(--ease)}#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s var(--ease),visibility .45s}.loadBox{text-align:center}.loadTitle{font-size:10px;letter-spacing:.24em;font-weight:900;color:var(--muted)}.loadText{font-size:14px;font-weight:650;margin-top:10px}.loadLine{width:190px;height:2px;background:var(--line);margin:20px auto 0;overflow:hidden;border-radius:2px}.loadLine i{display:block;width:45%;height:100%;background:var(--accent);animation:load 1.1s infinite var(--ease)}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
@media(max-width:900px){html,body{overflow:auto}#app{height:auto;min-height:100dvh}.layout{grid-template-columns:1fr;height:auto}.listPane{overflow:visible}.detailPane{border-left:0;border-top:1px solid var(--line);min-height:600px}.toolbar{flex-wrap:wrap}.search{min-width:100%}.brand{min-width:0}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.detailHero{grid-template-columns:1fr}.heroFlag{width:100%;max-width:360px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detailPane{padding:16px}.countryTitle{font-size:24px}.kv{grid-template-columns:120px 1fr}.compareCols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading"><div class="loadBox"><div class="loadTitle">WORLD ATLAS</div><div class="loadText" id="loadText">Loading every country…</div><div class="loadLine"><i></i></div></div></div>
<div id="app" style="visibility:hidden">
<header>
  <div class="top"><div class="brand"><div class="eyebrow">BOREDOM ARCADE</div><div class="title">World Atlas</div></div><div class="status"><i class="dot"></i><span id="statusText">READY</span></div></div>
  <div class="toolbar">
    <div class="search"><span class="search-icon">⌕</span><input id="search" autocomplete="off" placeholder="Search countries, capitals, ISO codes, regions…"></div>
    <select id="sort"><option value="name">Name A–Z</option><option value="population">Population ↓</option><option value="area">Area ↓</option></select>
    <button class="btn" id="random">Random</button><button class="btn" id="compareBtn">Compare</button><button class="btn" id="reset">Reset</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta"><span id="count">0 countries</span><span>Click a country to inspect everything available</span></div>
</header>
<div class="layout" id="layout">
  <section class="listPane"><div class="grid" id="grid"></div></section>
  <aside class="detailPane" id="detailPane">
    <div class="empty" id="empty"><div><strong>Select a country</strong><span>Its flag and full available dataset will appear here — no popup required.</span></div></div>
    <div class="normalView" id="normalView"></div>
    <div class="compareView" id="compareView"></div>
  </aside>
</div>
</div>
<div id="toast"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const state={atlas:null,countries:[],filtered:[],selected:null,region:'All',sort:'name',query:'',compare:false,compareSelection:[]};
const fmt={
  num:n=>n==null?'—':Number(n).toLocaleString('en-US'),
  pop:n=>n==null?'—':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n),
  area:n=>n==null?'—':Number(n).toLocaleString('en-US')+' km²',
  density:(p,a)=>!p||!a?'—':(p/a).toLocaleString('en-US',{maximumFractionDigits:1})+' /km²'
};
function esc(v){return v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function val(v){if(v==null||v==='')return '—';if(Array.isArray(v))return v.length?v.join(', '):'—';if(typeof v==='object')return Object.entries(v).map(([k,x])=>k+': '+val(x)).join(' · ')||'—';return String(v);}
function flag(c){return c.flagCdn||c.flagPng||c.flagSvg||''}
function flagImg(c,cls='heroFlag'){const src=flag(c);const fallback=esc(c.flagEmoji||'🏳️');return src?`<img class="${cls}" src="${esc(src)}" alt="Flag of ${esc(c.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"> <span style="display:none;place-items:center;font-size:44px">${fallback}</span>`:`<div class="${cls}" style="display:grid;place-items:center;font-size:44px">${fallback}</div>`}
function kv(k,v){return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(val(v))}</span></div>`}
function tags(arr){return `<div class="taglist">${(arr||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`}
function section(title,content,note=''){return `<section class="section"><div class="sectionHead"><h3>${esc(title)}</h3>${note?`<span>${esc(note)}</span>`:''}</div>${content}</section>`}
function formatWB(obj,key){if(!obj||obj.value==null)return 'No reported value';let n=Number(obj.value);let s;if(key==='gdp'||key==='gdpPerCapita')s='$'+(Math.abs(n)>=1e12?(n/1e12).toFixed(2)+'T':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':n.toLocaleString('en-US',{maximumFractionDigits:0}));else if(key==='lifeExpectancy')s=n.toFixed(1)+' years';else s=n.toFixed(1)+'%';return s+(obj.year?' · '+obj.year:'')}
function apply(){let list=state.countries.slice();if(state.region!=='All')list=list.filter(c=>c.region===state.region);let q=state.query;if(q){list=list.filter(c=>{let hay=[c.name,c.officialName,c.capital,c.cca2,c.cca3,c.region,c.subregion,c.demonym,(c.languages||[]).join(' '),(c.continents||[]).join(' ')].join(' ').toLowerCase();return hay.includes(q)})}if(state.sort==='population')list.sort((a,b)=>(b.population||0)-(a.population||0));else if(state.sort==='area')list.sort((a,b)=>(b.area||0)-(a.area||0));else list.sort((a,b)=>(a.name||'').localeCompare(b.name||''));state.filtered=list;renderGrid()}
function renderGrid(){const grid=$('grid');grid.classList.toggle('compare',state.compare);$('count').textContent=state.filtered.length+' '+(state.filtered.length===1?'country':'countries');if(!state.filtered.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">No countries found.</div>';return}grid.innerHTML=state.filtered.map((c,i)=>{let sel=state.compareSelection.includes(c.cca3);return `<article class="card ${sel?'selected':''}" data-code="${esc(c.cca3)}" style="animation-delay:${Math.min(i,20)*12}ms"><div class="check">${sel?'✓':''}</div>${flagImg(c,'card-flag')}<div class="card-info"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.capital||c.region||'Country')}</div><div class="card-bottom"><span>${esc(c.region||'—')}</span><span>${esc(fmt.pop(c.population))}</span></div></div></article>`}).join('')}
function show(c){if(!c)return;state.selected=c;renderDetail(c);$('detailPane').scrollTop=0;document.querySelectorAll('.card').forEach(x=>x.classList.toggle('selected',x.dataset.code===c.cca3&&state.compareSelection.includes(c.cca3)))}
function renderDetail(c){$('empty').style.display='none';const eco=c.economy||{};let economyRows=Object.keys(eco).map(k=>kv(k,formatWB(eco[k],k))).join('');let identity=[kv('Official name',c.officialName),kv('Native names',Object.entries(c.nativeNames||{}).map(([k,v])=>{if(typeof v==='object')return k+': '+(v.official||v.common||'');return k+': '+v}).join(' · ')),kv('ISO alpha-2',c.cca2),kv('ISO alpha-3',c.cca3),kv('IOC',c.cioc),kv('FIFA',c.fifa),kv('Internet domains',c.tld),kv('Status',c.status),kv('UN member',c.unMember?'Yes':'No'),kv('Independent',c.independent?'Yes':'No')].join('');let geo=[kv('Capital',c.capital),kv('Capital coordinates',c.capitalLatLng),kv('Country coordinates',c.latlng),kv('Region',c.region),kv('Subregion',c.subregion),kv('Continents',c.continents),kv('Time zones',c.timezones),kv('Landlocked',c.landlocked?'Yes':'No'),kv('Driving side',c.drivingSide),kv('Borders',(c.borders||[]).length+' countries')].join('');let demo=[kv('Population',fmt.num(c.population)),kv('Population density',fmt.density(c.population,c.area)),kv('Languages',c.languages),kv('Language codes',c.languageCodes),kv('Currency', (c.currencies||[]).map(x=>x.name+' ('+x.code+(x.symbol?' '+x.symbol:'')+')')),kv('Demonym',c.demonym),kv('Gini',c.gini?(c.gini.value+' · '+c.gini.year):null)].join('');let misc=[kv('Calling codes',c.callingCodes),kv('Postal format',c.postalCodeFormat),kv('Postal regex',c.postalCodeRegex),kv('Start of week',c.startOfWeek),kv('Vehicle signs',c.carSigns),kv('Flag emoji',c.flagEmoji)].join('');$('normalView').innerHTML=`<div class="detailHero">${flagImg(c)}<div><div class="countryTitle">${esc(c.name)} ${esc(c.flagEmoji||'')}</div><div class="official">${esc(c.officialName||'')}</div><div class="badges">${c.region?`<span class="badge">${esc(c.region)}</span>`:''}${c.subregion?`<span class="badge">${esc(c.subregion)}</span>`:''}${c.landlocked?'<span class="badge">Landlocked</span>':''}${c.unMember?'<span class="badge">UN member</span>':''}</div></div></div><div class="stats"><div class="stat"><label>Population</label><b>${esc(fmt.pop(c.population))}</b></div><div class="stat"><label>Area</label><b>${esc(fmt.area(c.area))}</b></div><div class="stat"><label>Capital</label><b>${esc(c.capital||'—')}</b></div><div class="stat"><label>Countries</label><b>${esc(c.region||'—')}</b></div></div>${section('Identity',identity)}${section('Geography',geo)}${section('Demographics',demo)}${section('Codes & misc',misc)}${section('World Bank indicators',economyRows||'<div class="kv"><span class="k">Status</span><span class="v">No bundled indicators reported</span></div>','bundled at deploy time')}<section class="section raw"><details><summary>Show the complete original country record</summary><pre>${esc(JSON.stringify(c.raw,null,2))}</pre></details></section>`}
function compareCard(c){if(!c)return `<div class="compareCol"><div class="compareRow"><span>Selection</span><b>Click a country</b></div></div>`;let eco=c.economy||{};return `<div class="compareCol"><h3>${esc(c.name)} ${esc(c.flagEmoji||'')}</h3>${flagImg(c,'compareFlag')}${kv('Population',fmt.num(c.population))}${kv('Area',fmt.area(c.area))}${kv('Capital',c.capital)}${kv('Region',c.region)}${kv('Subregion',c.subregion)}${kv('Languages',c.languages)}${kv('Currency',(c.currencies||[]).map(x=>x.name+' ('+x.code+')'))}${kv('Time zones',c.timezones)}${kv('Calling codes',c.callingCodes)}${kv('Driving side',c.drivingSide)}${kv('Borders',(c.borders||[]).length)}${kv('GDP',formatWB(eco.gdp,'gdp'))}${kv('GDP per capita',formatWB(eco.gdpPerCapita,'gdpPerCapita'))}${kv('Life expectancy',formatWB(eco.lifeExpectancy,'lifeExpectancy'))}</div>`}
function renderCompare(){let a=state.compareSelection[0]?state.countries.find(c=>c.cca3===state.compareSelection[0]):null,b=state.compareSelection[1]?state.countries.find(c=>c.cca3===state.compareSelection[1]):null;$('compareView').innerHTML=`<div class="hint">Select two countries from the left. Comparison stays on this screen — no popup.</div><div class="compareCols">${compareCard(a)}${compareCard(b)}</div>`}
function buildChips(){let regions=[...new Set(state.countries.map(c=>c.region).filter(Boolean))].sort();$('chips').innerHTML=['All',...regions].map(r=>`<button class="chip ${r===state.region?'active':''}" data-region="${esc(r)}">${esc(r)}</button>`).join('');$('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.region=b.dataset.region;buildChips();apply()})}
let timer;function onSearch(){cancelAnimationFrame(timer);timer=requestAnimationFrame(()=>{state.query=$('search').value.trim().toLowerCase();apply()})}
$('search').addEventListener('input',onSearch);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&state.filtered[0])show(state.filtered[0]);if(e.key==='Escape'){$('search').value='';state.query='';apply();$('search').blur()}});
$('sort').onchange=e=>{state.sort=e.target.value;apply()};$('random').onclick=()=>{let c=state.countries[Math.floor(Math.random()*state.countries.length)];if(c){state.compare=false;state.compareSelection=[];$('compareBtn').classList.remove('active');$('layout').classList.remove('compareMode');show(c)}};
$('reset').onclick=()=>{state.query='';state.region='All';state.sort='name';state.compare=false;state.compareSelection=[];$('search').value='';$('sort').value='name';$('compareBtn').classList.remove('active');$('layout').classList.remove('compareMode');buildChips();apply()};
$('compareBtn').onclick=()=>{state.compare=!state.compare;$('compareBtn').classList.toggle('active',state.compare);$('layout').classList.toggle('compareMode',state.compare);if(state.compare){state.compareSelection=[];renderCompare()}renderGrid()};
$('grid').addEventListener('click',e=>{let card=e.target.closest('.card');if(!card)return;let c=state.countries.find(x=>x.cca3===card.dataset.code);if(!c)return;if(state.compare){let i=state.compareSelection.indexOf(c.cca3);if(i>=0)state.compareSelection.splice(i,1);else{if(state.compareSelection.length>=2)state.compareSelection.shift();state.compareSelection.push(c.cca3)}renderCompare();renderGrid()}else show(c)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('search').focus()}});
async function boot(){try{$('loadText').textContent='Loading every country…';let r=await fetch('./atlas-data.json',{cache:'no-store'});if(!r.ok)throw Error('atlas-data.json '+r.status);state.atlas=await r.json();state.countries=state.atlas.countries||[];buildChips();apply();$('statusText').textContent=state.countries.length+' COUNTRIES';$('app').style.visibility='visible';$('loading').style.opacity='0';$('loading').style.visibility='hidden';if(state.countries[0])show(state.countries[0])}catch(err){console.error(err);$('loadText').textContent='Atlas data could not be loaded. Refresh the page.'}}
boot();
})();
</script>
</body>
</html>
